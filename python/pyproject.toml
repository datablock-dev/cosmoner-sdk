[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmoner-sdk"
version = "1.0.0"
description = "Cosmoner SDK for Python"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "httpx>=0.24",
]
keywords = ["cosmoner", "sdk"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosmoner"]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-httpx>=0.28",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://cosmoner.com"
