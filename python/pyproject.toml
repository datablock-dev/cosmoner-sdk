[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datablock-sdk"
version = "1.0.0"
description = "Datablock SDK for Python"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "httpx>=0.24",
]
keywords = ["datablock", "sdk"]

[project.urls]
Homepage = "https://datablock.dev"
