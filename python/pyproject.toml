[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datablock-sdk"
version = "1.0.0"
description = "Datablock SDK for Python"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "httpx>=0.24",
]
keywords = ["datablock", "sdk"]

[tool.hatch.build.targets.wheel]
packages = ["src/datablock"]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://datablock.dev"
