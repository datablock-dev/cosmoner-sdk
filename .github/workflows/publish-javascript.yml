name: Publish JavaScript SDK (Reusable)

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: javascript

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Credentials are the default GITHUB_TOKEN; the version-bump step pushes with them.
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Determine next release version
        id: release_version
        uses: ietf-tools/semver-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: javascript/
          patchAll: true
          noVersionBumpBehavior: patch
          maxTagsToFetch: 100

      # src/version.ts carries the version into the User-Agent, because the
      # bundled SDK has no manifest to read at runtime. It is rewritten here so
      # that it cannot fall behind package.json the way it did before this step
      # existed; version.test.ts fails the build if it ever does again.
      - name: Bump version in package.json and src/version.ts
        if: steps.release_version.outputs.next != ''
        run: |
          VERSION="${{ steps.release_version.outputs.next }}"
          VERSION="${VERSION#javascript/v}"
          # --allow-same-version because package.json can already be at the
          # computed version: an earlier run commits the bump and then fails
          # before publishing and tagging, leaving the manifest ahead of the
          # tags. Without this the next run dies here with "Version not
          # changed", and every run after it, forever — which is how
          # @cosmoner/sdk sat at 1.2.0 in the manifest with no v1.2.0 tag and
          # nothing on npm. Recovering means finishing that release, not
          # refusing to start it.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node scripts/sync-version.mjs

      - name: Commit version bump
        if: steps.release_version.outputs.next != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts
          # Nothing staged means the bump commit already landed in that earlier
          # run. That is the state being recovered from, not a failure: skip
          # straight to publishing.
          if git diff --cached --quiet; then
            echo "Already at ${{ steps.release_version.outputs.next }}; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): javascript ${{ steps.release_version.outputs.next }} [skip ci]"
          # Sibling language jobs push to main in parallel, so rebase and retry
          # instead of failing the release on a lost ref-lock race.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            sleep $(( (RANDOM % 5) + 2 ))
            git pull --rebase origin main
          done
          exit 1

      # Publish before tagging so a registry failure does not leave behind a
      # GitHub release for a version that was never published.
      - name: Publish to npm
        if: steps.release_version.outputs.next != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.release_version.outputs.next != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.release_version.outputs.next }}',
              target_commitish: 'main',
              name: 'JavaScript ${{ steps.release_version.outputs.next }}',
              generate_release_notes: true
            });
            console.log(`Created release ${release.id} at ${release.html_url}`);
