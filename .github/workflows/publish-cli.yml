name: Publish CLI (Reusable)

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Credentials are the default GITHUB_TOKEN; the version-bump step pushes with them.
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+, which Node 24 bundles.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # `npm test` builds first — see cli/package.json.
      - name: Build and test
        run: npm test

      - name: Determine next release version
        id: release_version
        uses: ietf-tools/semver-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: cli/
          patchAll: true
          noVersionBumpBehavior: patch
          maxTagsToFetch: 100

      - name: Bump version in package.json
        if: steps.release_version.outputs.next != ''
        run: |
          VERSION="${{ steps.release_version.outputs.next }}"
          VERSION="${VERSION#cli/v}"
          # --allow-same-version because package.json can already be at the
          # computed version: an earlier run commits the bump and then fails
          # before publishing and tagging, leaving the manifest ahead of the
          # tags. Without this the next run dies here with "Version not
          # changed", and every run after it, forever — which is how
          # @cosmoner/sdk sat at 1.2.0 in the manifest with no v1.2.0 tag and
          # nothing on npm. Recovering means finishing that release, not
          # refusing to start it.
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Commit version bump
        if: steps.release_version.outputs.next != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          # Nothing staged means the bump commit already landed in that earlier
          # run. That is the state being recovered from, not a failure: skip
          # straight to publishing.
          if git diff --cached --quiet; then
            echo "Already at ${{ steps.release_version.outputs.next }}; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): cli ${{ steps.release_version.outputs.next }} [skip ci]"
          # Sibling language jobs push to main in parallel, so rebase and retry
          # instead of failing the release on a lost ref-lock race.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            sleep $(( (RANDOM % 5) + 2 ))
            git pull --rebase origin main
          done
          exit 1

      # Publish before tagging so a registry failure does not leave behind a
      # GitHub release for a version that was never published.
      - name: Publish to npm
        if: steps.release_version.outputs.next != ''
        # No token: npm trusts the job's OIDC identity (id-token: write above),
        # matched against the trusted publisher configured on the package.
        # Verbose so a failed OIDC exchange says why; otherwise npm falls back to
        # anonymous and reports only a 404.
        run: |
          npm --version
          npm publish --access public --loglevel verbose

      - name: Create GitHub Release
        if: steps.release_version.outputs.next != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.release_version.outputs.next }}',
              target_commitish: 'main',
              name: 'CLI ${{ steps.release_version.outputs.next }}',
              generate_release_notes: true
            });
            console.log(`Created release ${release.id} at ${release.html_url}`);
