name: Release

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      javascript: ${{ steps.changes.outputs.javascript }}
      php: ${{ steps.changes.outputs.php }}
      cli: ${{ steps.changes.outputs.cli }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            python:
              - 'python/**'
            javascript:
              - 'javascript/**'
            php:
              - 'php/**'
            # The CLI bundles the JavaScript SDK's source, so an SDK release is
            # also a CLI release — otherwise the published CLI keeps shipping
            # the validator from whenever cli/ last changed.
            cli:
              - 'cli/**'
              - 'javascript/**'
              - 'schemas/**'

  publish-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    uses: ./.github/workflows/publish-python.yml
    secrets: inherit

  publish-javascript:
    needs: detect-changes
    if: needs.detect-changes.outputs.javascript == 'true'
    uses: ./.github/workflows/publish-javascript.yml
    secrets: inherit

  publish-php:
    needs: detect-changes
    if: needs.detect-changes.outputs.php == 'true'
    uses: ./.github/workflows/publish-php.yml
    secrets: inherit

  # After the SDK so that a commit touching both does not race it, but not
  # conditional on the SDK release succeeding. The CLI bundles the SDK's source
  # rather than depending on the published package, so a CLI build is complete
  # whether or not the SDK reached the registry — and gating on it meant one
  # stuck package held the other back indefinitely, which is what happened.
  publish-cli:
    needs: [detect-changes, publish-javascript]
    if: always() && needs.detect-changes.outputs.cli == 'true'
    uses: ./.github/workflows/publish-cli.yml
    secrets: inherit
