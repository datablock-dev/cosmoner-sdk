name: Publish PHP SDK (Reusable)

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.ORG_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Validate composer.json
        run: composer validate --strict
        working-directory: php

      - name: Install dependencies
        run: composer install --no-interaction
        working-directory: php

      - name: Run tests
        run: vendor/bin/phpunit
        working-directory: php

      - name: Determine next release version
        id: release_version
        uses: ietf-tools/semver-action@v1.11.0
        with:
          token: ${{ secrets.ORG_TOKEN }}
          prefix: php/v
          patchAll: true
          noVersionBumpBehavior: patch
          fallbackTag: php/v1.0.0

      - name: Create GitHub Release
        if: steps.release_version.outputs.next != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.release_version.outputs.next }}',
              target_commitish: 'main',
              name: 'PHP ${{ steps.release_version.outputs.next }}',
              generate_release_notes: true
            });
            console.log(`Created release ${release.id} at ${release.html_url}`);
