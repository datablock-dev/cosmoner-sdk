name: Publish PHP SDK (Reusable)

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Nothing here pushes, so keep the token out of .git/config.
          persist-credentials: false

      # 8.4, not the 8.1 floor: this installs from the committed lock, and the
      # lock is resolved on the newest supported version — symfony/yaml is
      # pinned there at a release needing 8.4.1, so `composer install` cannot
      # satisfy it on anything older. CI covers the floor separately by
      # resolving fresh on 8.1, which is what proves the library still works
      # there; this job only needs a sound install to run the tests before
      # tagging a release.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Validate composer.json
        run: composer validate --strict
        working-directory: php

      - name: Install dependencies
        run: composer install --no-interaction
        working-directory: php

      - name: Run tests
        run: vendor/bin/phpunit
        working-directory: php

      - name: Determine next release version
        id: release_version
        uses: ietf-tools/semver-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: php/
          patchAll: true
          noVersionBumpBehavior: patch
          maxTagsToFetch: 100

      - name: Create GitHub Release
        if: steps.release_version.outputs.next != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.release_version.outputs.next }}',
              target_commitish: 'main',
              name: 'PHP ${{ steps.release_version.outputs.next }}',
              generate_release_notes: true
            });
            console.log(`Created release ${release.id} at ${release.html_url}`);
